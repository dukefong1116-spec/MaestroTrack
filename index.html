<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MaestroTrack — The practice intelligence platform for musicians. Track practice, monitor students, and build better habits." />
    <meta name="theme-color" content="#F1ECF8" />
    <!--
      Applied before the first paint, so a chosen theme does not flash the
      other one on the way in. Reads the same key the app writes; wrapped
      because private mode can throw on localStorage access.

      With nothing stored the attribute is set to "light" rather than left
      off: off means "follow the OS" to the stylesheet, so a first visit on
      a dark-mode machine would have painted dark before React could say
      otherwise.
    -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('maestro_prefs') || 'null') || {};
          var r = document.documentElement;
          if (p.theme === 'dark' || p.theme === 'light') r.dataset.theme = p.theme;
          else if (p.theme !== 'system') r.dataset.theme = 'light';
          if (p.reduceMotion === true) r.dataset.motion = 'reduce';
          if (typeof p.displayScale === 'number') r.style.setProperty('--clay-zoom', p.displayScale / 100);
        } catch (e) { /* no stored preference, or no storage at all */ }
      })();
    </script>
    <title>MaestroTrack — Practice Intelligence for Musicians</title>
    <!--
      The secure connections to Firebase are set up while the app's code
      is still downloading, instead of after: sign-in, then the database.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <!-- Installed to the Home Screen: its own icon, full screen. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MaestroTrack" />
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
